name: WatchAlarm
options:
  bundleIdPrefix: com.codemaki
  developmentLanguage: ko
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: W345C6H54N
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # 앱 버전 (App Store Connect 에 올릴 때마다 CURRENT_PROJECT_VERSION 을 올려야 함)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # iOS 컴패니언 앱
  WatchAlarm:
    type: application
    platform: iOS
    sources: [iOS, Shared, SharedApp]
    dependencies:
      - target: WatchAlarmWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codemaki.WatchAlarm
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: GAlarm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: iOS/WatchAlarm.entitlements
      properties:
        com.apple.security.application-groups: [group.com.codemaki.watchalarm]
        com.apple.developer.usernotifications.time-sensitive: true

  # watchOS 앱 (단일 타깃 워치 앱)
  WatchAlarmWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared, SharedApp]
    dependencies:
      - target: WatchAlarmWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codemaki.WatchAlarm.watchkitapp
        PRODUCT_NAME: WatchAlarmWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: GAlarm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.codemaki.WatchAlarm
    entitlements:
      path: Watch/WatchAlarmWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.codemaki.watchalarm]

  # WidgetKit 컴플리케이션 (watchOS)
  WatchAlarmWidget:
    type: app-extension
    platform: watchOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codemaki.WatchAlarm.watchkitapp.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: GAlarm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/WatchAlarmWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.codemaki.watchalarm]

schemes:
  WatchAlarm:
    build:
      targets:
        WatchAlarm: all
    run:
      config: Debug
    archive:
      config: Release
  WatchAlarmWatch:
    build:
      targets:
        WatchAlarmWatch: all
    run:
      config: Debug
